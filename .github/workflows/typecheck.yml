name: Type Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mypy:
    name: Type Check with Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy homeassistant aiohttp
          
      - name: Run Mypy
        # Wir prüfen nur unseren Ordner und ignorieren fehlende externe Bibliotheken
        run: mypy custom_components/warema_webcontrol --ignore-missing-imports
